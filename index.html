<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Shaverma AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#ffffff;
      --surface:#ffffff;
      --surface-2:#f7f4ef;
      --text:#15120f;
      --muted:#8b8176;
      --line:#ebe5dd;
      --accent:#ff5a1f;
      --accent-2:#e84e18;
      --danger:#b63d16;
      --shadow:0 8px 30px rgba(33,22,12,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      touch-action:manipulation;
    }
    button,textarea{font:inherit}
    button{border:0;background:none;color:inherit}
    .app{
      height:100dvh;
      min-height:100%;
      display:flex;
      flex-direction:column;
      background:var(--bg);
    }

    .topbar{
      flex:0 0 auto;
      height:64px;
      padding:10px 14px 8px;
      padding-top:max(10px, env(safe-area-inset-top));
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(12px);
      z-index:5;
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand-mark{
      width:30px;height:30px;border-radius:10px;
      background:var(--accent);
      position:relative;flex:0 0 auto;
    }
    .brand-mark:after{
      content:"";
      position:absolute;inset:7px;
      border:2px solid #fff;border-radius:4px;
    }
    .brand-title{font-weight:750;font-size:16px;line-height:1.1}
    .brand-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .top-actions{display:flex;gap:6px}
    .icon-btn{
      width:38px;height:38px;border-radius:12px;
      display:grid;place-items:center;
      color:var(--muted);
    }
    .icon-btn:active{background:var(--surface-2)}
    .line-icon{
      width:18px;height:18px;position:relative;display:block;
    }
    .line-icon.menu:before,.line-icon.menu:after,.line-icon.menu{
      border-top:2px solid currentColor;
    }
    .line-icon.menu:before,.line-icon.menu:after{content:"";position:absolute;left:0;right:0}
    .line-icon.menu:before{top:5px}.line-icon.menu:after{top:11px}
    .line-icon.plus:before,.line-icon.plus:after{
      content:"";position:absolute;background:currentColor;border-radius:2px;
    }
    .line-icon.plus:before{width:18px;height:2px;top:8px;left:0}
    .line-icon.plus:after{width:2px;height:18px;left:8px;top:0}

    .chat{
      flex:1 1 auto;
      min-height:0;
      overflow-y:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      padding:18px 14px 12px;
    }
    .chat-inner{
      width:100%;
      max-width:760px;
      margin:0 auto;
      min-height:100%;
      display:flex;
      flex-direction:column;
    }

    .welcome{
      margin:auto 0;
      padding:18px 8px 22px;
      text-align:center;
    }
    .welcome-mark{
      width:54px;height:54px;margin:0 auto 16px;border-radius:16px;
      background:var(--accent);
      position:relative;
    }
    .welcome-mark:before,.welcome-mark:after{
      content:"";position:absolute;background:#fff;border-radius:4px;
    }
    .welcome-mark:before{width:28px;height:5px;left:13px;top:17px}
    .welcome-mark:after{width:20px;height:5px;left:17px;top:29px}
    .welcome h1{margin:0;font-size:26px;letter-spacing:-.03em}
    .welcome p{
      margin:10px auto 0;max-width:360px;
      color:var(--muted);font-size:14px;line-height:1.55
    }
    .quick-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
      gap:8px;max-width:420px;margin:18px auto 0;
    }
    .quick{
      text-align:left;padding:12px 13px;border:1px solid var(--line);
      border-radius:14px;background:var(--surface);
      font-size:13px;font-weight:600;
    }
    .quick:active{background:var(--surface-2)}

    .message{
      display:flex;
      margin:7px 0;
      gap:9px;
      animation:appear .16s ease-out;
    }
    .message.user{justify-content:flex-end}
    .message .bubble{
      max-width:min(88%,680px);
      padding:11px 13px;
      border-radius:16px;
      font-size:15px;
      line-height:1.48;
      word-break:break-word;
      white-space:pre-wrap;
    }
    .message.assistant .bubble{
      background:var(--surface-2);
      border:1px solid var(--line);
      border-top-left-radius:6px;
    }
    .message.user .bubble{
      background:var(--accent);
      color:#fff;
      border-top-right-radius:6px;
    }
    .typing .bubble{
      color:var(--muted);
      display:inline-flex;
      align-items:center;
      gap:5px;
    }
    .dot{
      width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5;
      animation:blink 1s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.14s}.dot:nth-child(3){animation-delay:.28s}

    .composer-wrap{
      flex:0 0 auto;
      border-top:1px solid var(--line);
      background:var(--bg);
      padding:9px 12px calc(10px + env(safe-area-inset-bottom));
    }
    .composer{
      max-width:760px;margin:0 auto;
      display:flex;align-items:flex-end;gap:8px;
      padding:7px 7px 7px 12px;
      border:1px solid var(--line);
      border-radius:17px;
      background:#fff;
      box-shadow:var(--shadow);
    }
    .input{
      flex:1;
      min-width:0;
      max-height:130px;
      min-height:24px;
      resize:none;
      border:0;
      outline:0;
      background:transparent;
      color:var(--text);
      font-size:15px;
      line-height:1.4;
      padding:4px 0;
    }
    .input::placeholder{color:#aaa197}
    .send{
      width:40px;height:40px;flex:0 0 auto;border-radius:12px;
      background:var(--accent);color:#fff;
      display:grid;place-items:center;
      font-weight:800;font-size:18px;
    }
    .send:active{background:var(--accent-2)}
    .send:disabled{opacity:.45}
    .send-arrow{
      width:14px;height:14px;border-right:2px solid currentColor;border-top:2px solid currentColor;
      transform:rotate(-45deg);margin-left:-4px;
    }

    .drawer-backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,.18);
      opacity:0;pointer-events:none;transition:.18s;z-index:20;
    }
    .drawer-backdrop.open{opacity:1;pointer-events:auto}
    .drawer{
      position:absolute;right:10px;top:58px;
      width:min(300px,calc(100vw - 20px));
      background:#fff;border:1px solid var(--line);border-radius:16px;
      box-shadow:0 18px 50px rgba(0,0,0,.15);
      padding:8px;
      transform:translateY(-5px) scale(.98);opacity:0;
      pointer-events:none;transition:.18s;transform-origin:top right;
    }
    .drawer.open{transform:none;opacity:1;pointer-events:auto}
    .menu-item{
      width:100%;padding:12px 12px;border-radius:12px;
      display:flex;flex-direction:column;align-items:flex-start;
      text-align:left;
    }
    .menu-item:active{background:var(--surface-2)}
    .menu-title{font-size:14px;font-weight:650}
    .menu-note{font-size:12px;color:var(--muted);margin-top:3px}
    .divider{height:1px;background:var(--line);margin:5px 0}
    .danger .menu-title{color:var(--danger)}

    @keyframes appear{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
    @keyframes blink{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-2px);opacity:1}}
    @media (max-width:430px){
      .welcome h1{font-size:24px}
      .quick-grid{grid-template-columns:1fr}
      .message .bubble{max-width:92%}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <div class="brand-title">Shaverma AI</div>
        <div class="brand-sub">язвительный, но полезный</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="newChatBtn" aria-label="Новый диалог" title="Новый диалог">
        <span class="line-icon plus"></span>
      </button>
      <button class="icon-btn" id="menuBtn" aria-label="Настройки" title="Настройки">
        <span class="line-icon menu"></span>
      </button>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="chat-inner" id="chatInner">
      <section class="welcome" id="welcome">
        <div class="welcome-mark" aria-hidden="true"></div>
        <h1>Ну, спрашивай.</h1>
        <p>Чат здесь. Без команд, лишних окон и прыжков обратно в Telegram.</p>
        <div class="quick-grid">
          <button class="quick" data-prompt="Разбери мою идею и скажи, что в ней не так.">Разбери мою идею</button>
          <button class="quick" data-prompt="Напиши рабочий код и без лишней воды объясни его.">Нужен код</button>
          <button class="quick" data-prompt="Объясни сложную тему простыми словами.">Объясни тему</button>
          <button class="quick" data-prompt="Помоги придумать нормальный план действий.">Нужен план</button>
        </div>
      </section>
    </div>
  </main>

  <div class="composer-wrap">
    <form class="composer" id="composer">
      <textarea class="input" id="input" rows="1" maxlength="12000"
        placeholder="Напиши что-нибудь..." autocomplete="off" spellcheck="true"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="Отправить" disabled>
        <span class="send-arrow"></span>
      </button>
    </form>
  </div>

  <div class="drawer-backdrop" id="backdrop">
    <aside class="drawer" id="drawer">
      <button class="menu-item" id="newChatMenu">
        <span class="menu-title">Новый диалог</span>
        <span class="menu-note">Сбросить контекст Gemini</span>
      </button>
      <div class="divider"></div>
      <button class="menu-item danger" id="closeBtn">
        <span class="menu-title">Закрыть Mini App</span>
        <span class="menu-note">Вернуться в Telegram</span>
      </button>
    </aside>
  </div>
</div>

<script>
(() => {
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    tg.disableVerticalSwipes?.();
  }

  const $ = id => document.getElementById(id);
  const chat = $("chat");
  const chatInner = $("chatInner");
  const welcome = $("welcome");
  const input = $("input");
  const sendBtn = $("sendBtn");
  const composer = $("composer");
  const menuBtn = $("menuBtn");
  const drawer = $("drawer");
  const backdrop = $("backdrop");
  const newChatBtn = $("newChatBtn");
  const newChatMenu = $("newChatMenu");
  const closeBtn = $("closeBtn");

  let sending = false;
  let hasMessages = false;

  function scrollBottom(smooth = true) {
    requestAnimationFrame(() => {
      chat.scrollTo({ top: chat.scrollHeight, behavior: smooth ? "smooth" : "auto" });
    });
  }

  function hideWelcome() {
    if (welcome) welcome.style.display = "none";
  }

  function escapeText(value) {
    return String(value ?? "");
  }

  function addMessage(role, text) {
    hideWelcome();
    hasMessages = true;

    const row = document.createElement("div");
    row.className = "message " + (role === "user" ? "user" : "assistant");

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = escapeText(text);

    row.appendChild(bubble);
    chatInner.appendChild(row);
    scrollBottom();
    return row;
  }

  function addTyping() {
    hideWelcome();
    const row = document.createElement("div");
    row.className = "message assistant typing";
    row.id = "typingRow";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    for (let i = 0; i < 3; i++) {
      const d = document.createElement("span");
      d.className = "dot";
      bubble.appendChild(d);
    }
    row.appendChild(bubble);
    chatInner.appendChild(row);
    scrollBottom();
  }

  function removeTyping() {
    $("typingRow")?.remove();
  }

  function setMenu(open) {
    drawer.classList.toggle("open", open);
    backdrop.classList.toggle("open", open);
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 130) + "px";
    sendBtn.disabled = sending || !input.value.trim();
  }

  async function api(path, payload = null) {
    const headers = {
      "Content-Type": "application/json",
      "X-Telegram-Init-Data": tg?.initData || ""
    };
    const response = await fetch(path, {
      method: "POST",
      headers,
      body: payload ? JSON.stringify(payload) : "{}"
    });
    let data = {};
    try { data = await response.json(); } catch {}
    if (!response.ok || !data.ok) {
      const err = data.error || "Сервер не ответил нормально.";
      throw new Error(err);
    }
    return data;
  }

  async function sendMessage(rawText = null) {
    const text = (rawText ?? input.value).trim();
    if (!text || sending) return;

    sending = true;
    input.value = "";
    autosize();
    addMessage("user", text);
    addTyping();

    try {
      const data = await api("/api/chat", { message: text });
      removeTyping();
      addMessage("assistant", data.answer);
    } catch (err) {
      removeTyping();
      addMessage("assistant", err.message || "Шаверма не смогла нормально обработать запрос.");
    } finally {
      sending = false;
      autosize();
      input.focus({preventScroll:true});
    }
  }

  async function resetChat() {
    if (sending) return;
    setMenu(false);
    try {
      await api("/api/reset");
    } catch {}
    chatInner.innerHTML = "";
    const newWelcome = document.createElement("section");
    newWelcome.className = "welcome";
    newWelcome.id = "welcome";
    newWelcome.innerHTML = `
      <div class="welcome-mark" aria-hidden="true"></div>
      <h1>Ну, спрашивай.</h1>
      <p>Чистый диалог. Предыдущий контекст сброшен.</p>
      <div class="quick-grid">
        <button class="quick" data-prompt="Разбери мою идею и скажи, что в ней не так.">Разбери мою идею</button>
        <button class="quick" data-prompt="Напиши рабочий код и без лишней воды объясни его.">Нужен код</button>
        <button class="quick" data-prompt="Объясни сложную тему простыми словами.">Объясни тему</button>
        <button class="quick" data-prompt="Помоги придумать нормальный план действий.">Нужен план</button>
      </div>`;
    chatInner.appendChild(newWelcome);
    hasMessages = false;
    bindQuickButtons();
    input.focus({preventScroll:true});
  }

  function bindQuickButtons() {
    document.querySelectorAll(".quick").forEach(btn => {
      btn.addEventListener("click", () => sendMessage(btn.dataset.prompt));
    });
  }

  composer.addEventListener("submit", e => {
    e.preventDefault();
    sendMessage();
  });

  input.addEventListener("input", autosize);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });

  menuBtn.addEventListener("click", () => setMenu(!drawer.classList.contains("open")));
  backdrop.addEventListener("click", e => {
    if (e.target === backdrop) setMenu(false);
  });
  newChatBtn.addEventListener("click", resetChat);
  newChatMenu.addEventListener("click", resetChat);
  closeBtn.addEventListener("click", () => tg?.close());

  bindQuickButtons();
  autosize();
  input.focus({preventScroll:true});
})();
</script>
</body>
</html>
